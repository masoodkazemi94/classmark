name: Test and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure deployment SSH key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Package release
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=.env.production \
            --exclude=.venv \
            --exclude=.postgres \
            --exclude=.postgres.log \
            --exclude=staticfiles \
            --exclude='*/__pycache__' \
            --exclude='*.pyc' \
            -czf "/tmp/classpulse-${RELEASE_ID}.tar.gz" .

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          scp "/tmp/classpulse-${RELEASE_ID}.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:classpulse-${RELEASE_ID}.tar.gz"

      - name: Deploy healthy release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "RELEASE_SHA=${RELEASE_SHA} RELEASE_RUN_ID=${RELEASE_RUN_ID} RELEASE_ATTEMPT=${RELEASE_ATTEMPT} bash -s" \
            < docker/deploy.sh
